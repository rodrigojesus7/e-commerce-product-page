<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Product Page</title>

    <link rel="shortcut icon" href="./src/images/favicon-32x32.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,40..300&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/responsive.css">
</head>

<body>

    <header class="header">
        <div class="header__menu">
            <button class="header__menu-button"><img src="./src/images/icon-menu.svg" alt=""></button>

            <a href=""><img src="./src/images/logo.svg" alt=""></a>
        </div>

        <div class="header__user-container">
            <button class="header__cart-button"><img src="./src/images/icon-cart.svg" alt=""></button>

            <img src="./src/images/image-avatar.png" alt="" class="header__avatar-img">
        </div>
    </header>


    <main>

        <article>
            <div>
                <img src="./src/images/image-product-1.jpg" alt="">
            </div>

            <div>
                <div>
                    <span>Sneaker Company</span>
                    <h1>Fall Limited Edition Sneakers</h1>
                    <p>These low-profile sneakers are your perfect casual wear companion. Featuring a durable rubber
                        outer sole, they’ll withstand everything the weather can offer.</p>
                </div>

                <div>
                    <div>
                        <p>$125.00</p>
                        <p>50%</p>
                    </div>

                    <s>$250.00</s>
                </div>

                <div>
                    <div>
                        <button><img src="./src/images/icon-minus.svg" alt=""></button>
                        <p>0</p>
                        <button><img src="./src/images/icon-plus.svg" alt=""></button>
                    </div>

                    <button><img src="./src/images/icon-cart.svg" alt=""> Add to cart</button>

                </div>
            </div>


        </article>


    </main>



</body>

</html>
